name: Build LennsFit Windows 10 64-bit Executable

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Bundle & Windows Executable (.exe)
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LennsFit-Portable-Windows-64bit
          path: |
            release/LennsFit-Portable-*.exe
            release/LennsFit-Setup-*.exe
            Run-LennsFit.bat

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/LennsFit-Portable-*.exe
            release/LennsFit-Setup-*.exe
            Run-LennsFit.bat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
